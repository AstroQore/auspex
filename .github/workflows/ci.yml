name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify toolchain
        run: |
          sw_vers -productVersion
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      # Both test targets — AuspexCoreTests and AuspexAppTests. `swift test`
      # runs every target in the package; naming them here would be a second
      # list to keep in step with Package.swift.
      - name: Test
        run: swift test

      # Also asserts that the signed bundle carries no app-sandbox
      # entitlement — see Scripts/build_app.sh.
      - name: Package app bundle
        run: ./Scripts/build_app.sh debug

      - name: Show signed entitlements
        run: codesign -dv --entitlements - .build/Auspex.app

      # A bundle that builds and signs but has no Sparkle in it is an app
      # whose updater silently never works. Cheap to assert, invisible
      # otherwise until a release is already in somebody's hands.
      - name: Verify Sparkle is bundled and sealed
        run: |
          set -euo pipefail
          framework=.build/Auspex.app/Contents/Frameworks/Sparkle.framework
          test -x "$framework/Versions/B/Sparkle"
          codesign --verify --deep --strict --verbose=2 "$framework"
